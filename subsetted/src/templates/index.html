<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <title>Emotion Detection</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        background-color: #f5f5f5;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
      }
      .model-selector {
        margin: 1rem 0;
      }
      select {
        padding: 0.5rem;
        border-radius: 4px;
        border: 1px solid #ced4da;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Emotion Detection</h1>
      <p>Upload an audio file to detect the emotion</p>

      <div class="model-selector">
        <label for="model">Select Model:</label>
        <select id="model">
          <option value="lgb">LightGBM</option>
          <option value="xgb">XGBoost</option>
          <option value="rf">Random Forest</option>
          <option value="mlp">MLP</option>
          <option value="lr">Logistic Regression</option>
          <option value="cnn">CNN</option>
          <option value="vit">Vision Transformer</option>
        </select>
      </div>

      <div class="upload-area">
        <input
          type="file"
          id="fileInput"
          accept=".mp3,.wav"
          style="display: none"
        />
        <button
          onclick=" document.getElementById('result').textContent = ''; document.getElementById('result').className = ''; document.getElementById('fileInput').click()"
        >
          Choose File
        </button>
      </div>
      <br />
      <div id="result" role="alert"></div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const resultDiv = document.getElementById("result");
      const modelSelect = document.getElementById("model");

      fileInput.addEventListener("change", handleFiles);

      function handleFiles(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        const file = files[0];
        if (!file.type.match("audio.*")) {
          showResult("Please upload an audio file (MP3 or WAV)", "error");
          return;
        }

        uploadFile(file);
      }

      function uploadFile(file) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("model", modelSelect.value);

        fetch("/upload", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.error) {
              showResult(data.error, "error");
            } else {
              showResult(`Detected Emotion: ${data.prediction}`, "success");
            }
          })
          .catch((error) => {
            showResult("An error occurred while processing the file", "error");
            console.error("Error:", error);
          });
      }

      function showResult(message, type) {
        resultDiv.textContent = message;
        resultDiv.className = "alert alert-" + type;
      }
    </script>
  </body>
</html>
